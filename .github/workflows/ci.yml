name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端：编译 + 测试 =====
  backend:
    name: Backend (SpringBoot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B compile
      - name: Test
        run: mvn -B test
      - name: Package (skip tests, jar 产物)
        run: mvn -B -DskipTests package
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-notes-server.jar
          path: backend/target/reading-notes-server-*.jar

  # ===== 前端：依赖安装 + 构建 =====
  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build

  # ===== 数据库：MySQL 迁移脚本完整性校验 =====
  database:
    name: Database (MySQL migrations)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: reading_notes
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then echo "MySQL ready"; exit 0; fi
            sleep 2
          done
          echo "MySQL not ready"; exit 1
      - name: Apply migrations (0001 -> 0007)
        run: |
          for f in backend/src/main/resources/sql/mysql/*.sql; do
            echo "==> $f"
            mysql -h 127.0.0.1 -uroot -proot reading_notes < "$f" || exit 1
          done
      - name: Verify seed data
        run: |
          eval_cnt=$(mysql -h 127.0.0.1 -uroot -proot reading_notes -N -e "SELECT COUNT(*) FROM eval_datasets")
          prompt_cnt=$(mysql -h 127.0.0.1 -uroot -proot reading_notes -N -e "SELECT COUNT(*) FROM prompt_versions")
          tag_cnt=$(mysql -h 127.0.0.1 -uroot -proot reading_notes -N -e "SELECT COUNT(*) FROM tags")
          book_cnt=$(mysql -h 127.0.0.1 -uroot -proot reading_notes -N -e "SELECT COUNT(*) FROM books")
          mig_cnt=$(mysql -h 127.0.0.1 -uroot -proot reading_notes -N -e "SELECT COUNT(*) FROM schema_migrations")
          echo "eval=$eval_cnt prompt=$prompt_cnt tags=$tag_cnt books=$book_cnt migrations=$mig_cnt"
          [ "$eval_cnt" -eq 50 ]   || { echo "FAIL eval_datasets=$eval_cnt != 50"; exit 1; }
          [ "$prompt_cnt" -eq 8 ]  || { echo "FAIL prompt_versions=$prompt_cnt != 8"; exit 1; }
          [ "$tag_cnt" -eq 6 ]     || { echo "FAIL tags=$tag_cnt != 6"; exit 1; }
          [ "$book_cnt" -eq 5 ]    || { echo "FAIL books=$book_cnt != 5"; exit 1; }
          [ "$mig_cnt" -eq 7 ]     || { echo "FAIL schema_migrations=$mig_cnt != 7"; exit 1; }
          echo "DB_CHECKS_OK: 50 eval / 8 prompts / 6 tags / 5 books / 7 migrations"
