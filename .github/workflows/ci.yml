name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  # ===== 后端：编译 + 测试 =====
  backend:
    name: Backend (SpringBoot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile
        run: mvn -B compile
      - name: Test
        run: mvn -B test
      - name: Package (skip tests, jar 产物)
        run: mvn -B -DskipTests package
      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: reading-notes-server.jar
          path: backend/target/reading-notes-server-*.jar

  # ===== 前端：依赖安装 + 构建 =====
  frontend:
    name: Frontend (Vue3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build

  # ===== 数据库：迁移脚本完整性校验 =====
  database:
    name: Database (SQLite migrations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migrations (temp db)
        run: |
          cd backend/src/main/resources/sql
          python apply.py --db /tmp/notes_ci.db
          python apply.py --db /tmp/notes_ci.db --check
      - name: Verify seed data
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('/tmp/notes_ci.db')
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM eval_datasets');  assert cur.fetchone()[0] == 50, 'eval_datasets != 50'
          cur.execute('SELECT COUNT(*) FROM prompt_versions'); assert cur.fetchone()[0] == 8, 'prompt_versions != 8'
          cur.execute('SELECT COUNT(*) FROM tags');           assert cur.fetchone()[0] == 6, 'tags != 6'
          cur.execute('SELECT COUNT(*) FROM books');          assert cur.fetchone()[0] == 5, 'books != 5'
          cur.execute('PRAGMA foreign_key_check');            assert cur.fetchall() == [], 'foreign key violations'
          print('DB_CHECKS_OK: 50 eval / 8 prompts / 6 tags / 5 books / 0 fk violations')
          conn.close()
          "
