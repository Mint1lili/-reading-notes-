server:
  port: 8080

spring:
  application:
    name: reading-notes-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # MySQL 8 数据源（生产通过环境变量注入，避免密码进配置库）
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/reading_notes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-test-query: SELECT 1

# 数据与存储路径（相对项目根 data/）
app:
  data-dir: ${APP_DATA_DIR:../data}
  uploads-dir: ${APP_DATA_DIR:../data}/uploads
  logs-dir: ${APP_DATA_DIR:../data}/logs
  backups-dir: ${APP_DATA_DIR:../data}/backups
  prompts-dir: ${APP_DATA_DIR:../data}/config/prompts

# 豆包大模型 API（火山引擎 Ark，OpenAI 兼容端点）
# 生产必须通过环境变量注入：setx DOUBAO_API_KEY "你的key"
doubao:
  api-key: ${DOUBAO_API_KEY:}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  chat-model: ${DOUBAO_CHAT_MODEL:doubao-pro-32k}
  embedding-model: ${DOUBAO_EMBEDDING_MODEL:doubao-embedding-text-240715}
  embedding-dim: 1024
  batch-size: 16          # Embedding 批量大小（F2.4）
  max-retries: 3          # 429 指数退避重试上限

# Chroma 向量库（Server 模式）
chroma:
  base-url: ${CHROMA_BASE_URL:http://localhost:8000}
  health-check-interval-ms: 30000

# 向量化（Embedding）来源切换
# api  = 远端大模型平台（默认智谱 Embedding-3，OpenAI 兼容），免费额度 2000 万 tokens
# local = 本地开源向量模型（bge-small-zh 等），免费离线，需先启动本地服务
# 注意：api 模式下 key 通过环境变量 AI_EMBEDDING_API_KEY 注入，禁止写死
ai:
  embedding:
    mode: ${AI_EMBEDDING_MODE:api}
    api-base-url: ${AI_EMBEDDING_API_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${AI_EMBEDDING_API_KEY:}
    api-model: ${AI_EMBEDDING_API_MODEL:embedding-3}
    api-dim: 2048             # Embedding-3 默认 2048 维（与豆包 1024 不同）
    local-base-url: ${AI_EMBEDDING_LOCAL_BASE_URL:http://localhost:8001/v1}
    local-model: ${AI_EMBEDDING_LOCAL_MODEL:bge-small-zh}

# RAG 默认参数（F5.2，可在设置页运行时调整）
rag:
  recall-top-k: 10
  rerank-top-n: 5
  similarity-threshold: 0.5
  chunk-size: 600
  overlap: 100
  multi-turn-n: 3
  enable-rerank: true
  enable-metadata-filter: true

# 构建任务（F2）
build:
  worker-threads: 1       # 串行队列，避免 Embedding 并发限流
  chunk-soft-limit: 5000  # 单书切片软上限

logging:
  level:
    com.readingnotes: info
  file:
    name: ${APP_DATA_DIR:../data}/logs/app.log
