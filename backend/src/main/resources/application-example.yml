# ==============================================================
# 阅读笔记 · 配置模板（可提交/比赛交付用）
# --------------------------------------------------------------
# 用法：复制本文件为 application.yml 后按需修改
#   cp application-example.yml application.yml    (Linux/macOS)
#   copy application-example.yml application.yml  (Windows)
#
# 敏感项（SMTP 授权码、数据库密码、API Key）一律通过环境变量注入，
# 不要在本文件中填写真实值，更不要把真实值提交到仓库。
# 本仓库 .gitignore 已忽略 application.yml，只有本模板会入库。
# ==============================================================

server:
  port: 8080

spring:
  application:
    name: reading-notes-server
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  # MySQL 8 数据源（生产通过环境变量注入，避免密码进配置库）
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/reading_notes?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}"
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 8
      minimum-idle: 1
      connection-test-query: SELECT 1
  # Redis（邮箱验证码存储；本地未装可先装 Redis 或用 Docker）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
  # 邮箱 SMTP（验证码邮件发件账号）
  # MAIL_USERNAME 填发件邮箱，MAIL_PASSWORD 填该邮箱的 SMTP 授权码（QQ邮箱：设置→账户→开启SMTP服务）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true

# 数据与存储路径（相对项目根 data/）
app:
  data-dir: ${APP_DATA_DIR:../data}
  uploads-dir: ${APP_DATA_DIR:../data}/uploads
  logs-dir: ${APP_DATA_DIR:../data}/logs
  backups-dir: ${APP_DATA_DIR:../data}/backups
  prompts-dir: ${APP_DATA_DIR:../data}/config/prompts
  exports-dir: ${APP_DATA_DIR:../data}/exports
  export-ttl-hours: 1

# 豆包大模型 API（火山引擎 Ark，OpenAI 兼容端点）
doubao:
  api-key: ${DOUBAO_API_KEY:}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
  chat-model: ${DOUBAO_CHAT_MODEL:doubao-pro-32k}
  embedding-model: ${DOUBAO_EMBEDDING_MODEL:doubao-embedding-text-240715}
  embedding-dim: 1024
  batch-size: 16
  max-retries: 3

# Chroma 向量库（Server 模式）
chroma:
  base-url: ${CHROMA_BASE_URL:http://localhost:8000}
  health-check-interval-ms: 30000

# RAG 默认参数（F5.2，可在设置页运行时调整）
rag:
  recall-top-k: 10
  rerank-top-n: 5
  similarity-threshold: 0.5
  chunk-size: 600
  overlap: 100
  multi-turn-n: 3
  enable-rerank: true
  enable-metadata-filter: true

# 构建任务（F2）
build:
  worker-threads: 1
  chunk-soft-limit: 5000

# JWT（认证；secret 至少 32 字节，生产通过环境变量注入）
jwt:
  secret: ${JWT_SECRET:reading-notes-secret-key-must-be-at-least-32-bytes-2026}
  expire-millis: ${JWT_EXPIRE_MILLIS:7200000}
  issuer: reading-notes

logging:
  level:
    com.readingnotes: info
  file:
    name: ${APP_DATA_DIR:../data}/logs/app.log
